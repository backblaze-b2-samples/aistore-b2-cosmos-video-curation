[project]
name = "curation-gpu-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Select video stages without the optional vLLM captioning stack.
    "nemo-curator[video_cpu,cuda12]==1.3.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers>=5.21.0,<6",
    "pillow>=13.0.0",
    "cvcuda-cu12",
    "pycuda",
    "s3fs>=2024.12.0",
    "wheel-stub",
    "psutil",
    "setuptools>=84.2.1",
    "setuptools-scm",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
