[project]
name = "curation-gpu-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nemo-curator[video_cuda12]==1.3.0",
    "s3fs>=2024.12.0",
    "wheel-stub",
    "psutil",
    "setuptools",
    "setuptools-scm",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
