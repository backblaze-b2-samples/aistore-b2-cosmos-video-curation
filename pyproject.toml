[project]
name = "aistore-b2-curation"
version = "0.1.0"
description = "Produce video clips and embeddings with NeMo Curator from Backblaze B2, using AIStore as the in-cluster cache."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Backblaze, Inc." }]
requires-python = ">=3.10"
# NeMo Curator is not a dependency: it is Linux + NVIDIA GPU only and is installed into
# its own venv by `make setup-curator`. This package only does I/O wiring.
dependencies = [
    # Pinned to match the aistorage/cluster-minimal:v5.1 image in deploy/docker-compose.yml.
    "aistore==2.0.0",
    "boto3>=1.40,<2",
    "huggingface-hub>=1.0,<3",
    "requests>=2.33,<3",  # run_pipeline.py catches AIS SDK connection errors directly
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "ruff==0.17.2",
    "s3fs>=2024.12.0",  # integration tests replay NeMo Curator's fsspec/s3fs read path
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aistore_b2_curation"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S603", "S607"]  # run_pipeline.py launches Curator with argv lists

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --strict-markers"
# Signal-forwarding tests spawn process groups; a regression must fail, not hang CI.
timeout = 60
markers = ["integration: needs real B2 (B2_IT=1 in .env) and the disposable AIS cluster from `make test-integration`"]
