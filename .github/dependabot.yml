version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Must match the AIS image in deploy/docker-compose.yml; bump both in one change.
      - dependency-name: aistore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /deploy/curator
    schedule:
      interval: weekly
    ignore:
      # Cosmos-Embed1's custom model code requires Transformers 4 APIs.
      - dependency-name: transformers
        update-types: ["version-update:semver-major"]
